name: Package PDF Forge for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        type: boolean
        default: false
        description: Publish this build as the versioned GitHub prerelease
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --omit=optional --no-audit --no-fund
      - run: npm run vendor
      - run: npm test
      - run: ./scripts/package-win.ps1
        shell: pwsh
      - name: Verify PDF, EPUB, CBZ and the file shelf in the Windows executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'out/PDF-Forge-win-x64/PDF Forge.exe'
          $env:PDF_FORGE_SMOKE_MARKER = Join-Path $env:RUNNER_TEMP 'forge-smoke.txt'
          $process = Start-Process $exe -PassThru
          try {
            for ($i=0; $i -lt 60 -and !(Test-Path $env:PDF_FORGE_SMOKE_MARKER); $i++) {
              if ($process.HasExited) { throw "PDF Forge exited with code $($process.ExitCode)" }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path $env:PDF_FORGE_SMOKE_MARKER)) { throw 'The app did not report a completed reading test.' }
            $result = Get-Content $env:PDF_FORGE_SMOKE_MARKER -Raw
            if ($result -ne 'PDF, EPUB, CBZ and local shelf verified') { throw $result }
            Write-Output "Verified: $result"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Forge-Windows-x64
          path: out/PDF-Forge-Windows-x64.zip
          if-no-files-found: error
      - name: Publish downloadable Windows prerelease
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_preview)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists."; exit 0 }
          gh release create $tag out/PDF-Forge-Windows-x64.zip --target "${{ github.sha }}" --prerelease --title "PDF Forge $version Windows Preview" --notes "Portable Windows x64 preview. Extract the entire ZIP and open PDF Forge.exe. This build is unsigned. Read EPUB, FB2, CBZ, CBT, image archives and text documents, keep local copies on the File shelf, and continue using the PDF editing and conversion tools."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release was not published.' }
